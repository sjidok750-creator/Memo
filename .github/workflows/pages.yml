name: Deploy demo to GitHub Pages

# 정적 데모를 빌드해 gh-pages 브랜치에 올린다.
# 저장소 Settings → Pages 의 Source 가 "Deploy from a branch: gh-pages / (root)" 이면 된다
# (gh-pages 브랜치가 처음 생길 때 GitHub 이 보통 자동으로 잡아 준다).
on:
  push:
    branches: [main, "claude/**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build static demo
        run: node scripts/build-demo.mjs
        env:
          DEMO_BASE_PATH: /${{ github.event.repository.name }}
      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./out
          force_orphan: true
