<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560"><defs><linearGradient id="p" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#e9dfcc"/><stop offset=".08" stop-color="#f7f1e4"/><stop offset="1" stop-color="#f3ecdd"/></linearGradient></defs><rect width="800" height="560" fill="#c9bda6"/><rect x="40" y="30" width="720" height="500" rx="6" fill="url(#p)" transform="rotate(-1 400 280)"/><g font-family="serif" fill="#3a352c" transform="rotate(-1 400 280)"><text x="110" y="120" font-size="15" fill="#8a8272">2장 · 정체성을 바꾸는 습관</text><text x="110" y="180" font-size="24">습관은 목표를 이루는 도구가 아니다.</text><text x="110" y="222" font-size="24">습관은 내가 어떤 사람이 되고 싶은지에</text><text x="110" y="264" font-size="24">던지는 한 표다.</text><text x="110" y="330" font-size="24" font-weight="700">당신이 하는 모든 행동은 당신이 되고자 하는</text><text x="110" y="372" font-size="24" font-weight="700">사람에게 던지는 한 표다.</text><text x="110" y="440" font-size="24">한 번의 투표로 당선되지는 않는다. 하지만</text><text x="110" y="482" font-size="24">표는 쌓인다.</text></g></svg>
